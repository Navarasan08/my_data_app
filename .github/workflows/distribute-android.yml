name: Distribute Android to Firebase

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for testers'
        required: false
        default: 'Latest build from master'
      groups:
        description: 'Firebase tester group(s), comma separated'
        required: false
        default: 'testers'

env:
  FIREBASE_ANDROID_APP_ID: '1:446250056140:android:24cf269eaae717ca754569'
  DEFAULT_TESTER_GROUPS: 'testers'

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable
          cache: true

      - run: flutter --version

      - run: flutter pub get

      # Decode the upload keystore from a base64-encoded secret. The fail-fast
      # check below ensures we don't silently fall back to debug signing (which
      # would build a non-updateable APK).
      - name: Verify signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing ANDROID_UPLOAD_KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD" ]  && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_PASSWORD" ]    && missing="$missing ANDROID_KEY_PASSWORD"
          [ -z "$KEY_ALIAS" ]       && missing="$missing ANDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::Missing required signing secrets:$missing"
            echo "Configure them in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d -i > android/app/upload-keystore.jks
          # Sanity check: a real JKS starts with 0xFE ED FE ED
          head -c 4 android/app/upload-keystore.jks | xxd | grep -q 'feed feed' \
            || { echo "::error::Decoded keystore is not a valid JKS file. Re-encode the keystore (see message below)."; exit 1; }

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # storeFile is resolved by gradle relative to the android/app module,
          # which is where the previous step wrote it.
          cat > android/key.properties <<EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release --verbose

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ github.event.inputs.groups || env.DEFAULT_TESTER_GROUPS }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            ${{ github.event.inputs.release_notes || format('Build from {0} — {1}', github.ref_name, github.sha) }}
