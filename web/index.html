<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gloria - your personal record keeper.">

  <!-- iOS meta tags & icons -->
  <!-- apple-mobile-web-app-capable makes "Add to Home Screen" launch the app
       standalone, without Safari's chrome and without its edge-swipe history
       gesture, which is what blanks the app when swiped from the left. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Gloria">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Gloria</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // In a mobile browser the edge swipe is a history navigation. Flutter
    // keeps a sentinel entry so "back" at the root never leaves the page, but
    // after Safari's swipe animation the canvas can be left un-repainted
    // (a blank screen). Nudging a resize right after the pop makes the
    // engine draw a fresh frame.
    window.addEventListener('popstate', function () {
      setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 60);
    });
    // Same repaint nudge when the page is restored from the back/forward cache.
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) window.dispatchEvent(new Event('resize'));
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
